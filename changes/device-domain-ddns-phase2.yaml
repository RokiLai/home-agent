task: device-domain-ddns-phase2
description: 实施设备域名与 IPv6 DDNS 方案第二阶段：域名绑定领域、权限 API、Cloudflare 配置安全解析、观察模式、协议无关调和状态机与恢复队列，以及设备和服务端页面；不调用 Cloudflare 或修改 DNS。
external_dependencies:
  - module: golang.org/x/net
    rationale: 按设计契约执行 Unicode 域名到规范化 ASCII FQDN 的标准 IDNA 转换与校验。
  - module: golang.org/x/text
    rationale: golang.org/x/net/idna 的 Unicode 文本处理传递依赖。
allowed_paths:
  - changes/device-domain-ddns-phase2.yaml
