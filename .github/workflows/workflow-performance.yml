name: Workflow Performance Experiment

on:
  workflow_dispatch:
    inputs:
      group_id:
        description: Paired baseline/candidate experiment group identifier
        required: true
        type: string
      scenario:
        description: Component build scenario
        required: true
        default: both
        type: choice
        options:
          - server
          - agent
          - both

permissions:
  contents: read

concurrency:
  group: workflow-performance-${{ inputs.group_id }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out experiment commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up exact Go version without cache
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32
        with:
          go-version-file: go.mod
          cache: false
      - name: Run timed full regression
        run: ./scripts/run-workflow-tests.sh workflow-metrics/test
      - name: Upload test timing evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: workflow-performance-${{ inputs.group_id }}-${{ github.run_attempt }}-test
          path: workflow-metrics/test/
          if-no-files-found: error
          retention-days: 14

  build-server:
    if: inputs.scenario == 'server' || inputs.scenario == 'both'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out experiment commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up exact Go version without cache
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32
        with:
          go-version-file: go.mod
          cache: false
      - name: Build timed server targets
        run: ./scripts/build-release-component.sh server experiment dist workflow-metrics/build-server
      - name: Upload server timing evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: workflow-performance-${{ inputs.group_id }}-${{ github.run_attempt }}-server
          path: workflow-metrics/build-server/
          if-no-files-found: error
          retention-days: 14

  build-agent:
    if: inputs.scenario == 'agent' || inputs.scenario == 'both'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out experiment commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up exact Go version without cache
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32
        with:
          go-version-file: go.mod
          cache: false
      - name: Build timed agent targets
        run: ./scripts/build-release-component.sh agent experiment dist workflow-metrics/build-agent
      - name: Upload agent timing evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: workflow-performance-${{ inputs.group_id }}-${{ github.run_attempt }}-agent
          path: workflow-metrics/build-agent/
          if-no-files-found: error
          retention-days: 14
