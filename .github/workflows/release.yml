name: Create Release

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      server_version: ${{ steps.version.outputs.server_version }}
      agent_version: ${{ steps.version.outputs.agent_version }}
      server_changed: ${{ steps.version.outputs.server_changed }}
      agent_changed: ${{ steps.version.outputs.agent_changed }}
    steps:
      - name: Check out merged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Read component versions
        id: version
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          server_version=$(sed -nE 's/^const defaultServerVersion = "([^"]+)"/\1/p' internal/version/version.go)
          agent_version=$(sed -nE 's/^const defaultAgentVersion = "([^"]+)"/\1/p' internal/version/version.go)
          base_version_source=$(git show "${BASE_SHA}:internal/version/version.go")
          base_server_version=$(printf '%s\n' "$base_version_source" | sed -nE 's/^const defaultServerVersion = "([^"]+)"/\1/p')
          base_agent_version=$(printf '%s\n' "$base_version_source" | sed -nE 's/^const defaultAgentVersion = "([^"]+)"/\1/p')
          if [[ -z "$server_version" || -z "$agent_version" || -z "$base_server_version" || -z "$base_agent_version" ]]; then
            echo "Server and Agent versions must be non-empty in both base and merged commits" >&2
            exit 1
          fi
          server_changed=false
          agent_changed=false
          if [[ "$server_version" != "$base_server_version" ]]; then server_changed=true; fi
          if [[ "$agent_version" != "$base_agent_version" ]]; then agent_changed=true; fi
          echo "server_version=${server_version}" >> "$GITHUB_OUTPUT"
          echo "agent_version=${agent_version}" >> "$GITHUB_OUTPUT"
          echo "server_changed=${server_changed}" >> "$GITHUB_OUTPUT"
          echo "agent_changed=${agent_changed}" >> "$GITHUB_OUTPUT"
          echo "Server: ${base_server_version} -> ${server_version} (changed=${server_changed})"
          echo "Agent: ${base_agent_version} -> ${agent_version} (changed=${agent_changed})"

      - name: Check release tag conflicts
        if: steps.version.outputs.server_changed == 'true' || steps.version.outputs.agent_changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SERVER_CHANGED: ${{ steps.version.outputs.server_changed }}
          AGENT_CHANGED: ${{ steps.version.outputs.agent_changed }}
          SERVER_VERSION: ${{ steps.version.outputs.server_version }}
          AGENT_VERSION: ${{ steps.version.outputs.agent_version }}
        run: |
          check_tag_absent() {
            local tag="$1"
            local response
            local status
            set +e
            response=$(gh api -i "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" 2>&1)
            status=$?
            set -e
            if [[ $status -eq 0 ]]; then
              echo "Release ${tag} already exists" >&2
              exit 1
            fi
            if [[ "$response" != *"HTTP 404"* ]]; then
              printf '%s\n' "$response" >&2
              exit "$status"
            fi
          }
          if [[ "$SERVER_CHANGED" == "true" ]]; then check_tag_absent "server-${SERVER_VERSION}"; fi
          if [[ "$AGENT_CHANGED" == "true" ]]; then check_tag_absent "agent-${AGENT_VERSION}"; fi

  test:
    needs: prepare
    if: needs.prepare.outputs.server_changed == 'true' || needs.prepare.outputs.agent_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out merged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Run full regression tests
        run: ./scripts/run-workflow-tests.sh workflow-metrics/test

  build-server:
    needs: prepare
    if: needs.prepare.outputs.server_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out merged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Build server release assets
        shell: bash
        env:
          SERVER_VERSION: ${{ needs.prepare.outputs.server_version }}
        run: ./scripts/build-release-component.sh server "$SERVER_VERSION" dist workflow-metrics/build-server
      - name: Upload server release assets
        uses: actions/upload-artifact@v4
        with:
          name: server-release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 1

  build-agent:
    needs: prepare
    if: needs.prepare.outputs.agent_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out merged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Build agent release assets
        shell: bash
        env:
          AGENT_VERSION: ${{ needs.prepare.outputs.agent_version }}
        run: ./scripts/build-release-component.sh agent "$AGENT_VERSION" dist workflow-metrics/build-agent
      - name: Upload agent release assets
        uses: actions/upload-artifact@v4
        with:
          name: agent-release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 1

  release-server:
    needs: [prepare, test, build-server]
    if: >-
      always() &&
      needs.prepare.outputs.server_changed == 'true' &&
      needs.test.result == 'success' &&
      needs.build-server.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download server release assets
        uses: actions/download-artifact@v4
        with:
          name: server-release-assets
          path: dist
      - name: Create and verify server GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          VERSION: ${{ needs.prepare.outputs.server_version }}
        run: |
          tag="server-${VERSION}"
          gh release create "$tag" dist/homeagent-server-* --repo "$GITHUB_REPOSITORY" \
            --target "$MERGE_SHA" --title "Server ${VERSION}" --generate-notes --draft
          verify_dir=$(mktemp -d)
          trap 'rm -rf "$verify_dir"' EXIT
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$verify_dir"
          test "$(find "$verify_dir" -maxdepth 1 -type f | wc -l)" -eq 14
          (cd "$verify_dir" && sha256sum -c ./*.sha256)
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false

  release-agent:
    needs: [prepare, test, build-agent]
    if: >-
      always() &&
      needs.prepare.outputs.agent_changed == 'true' &&
      needs.test.result == 'success' &&
      needs.build-agent.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download agent release assets
        uses: actions/download-artifact@v4
        with:
          name: agent-release-assets
          path: dist
      - name: Create and verify agent GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          VERSION: ${{ needs.prepare.outputs.agent_version }}
        run: |
          tag="agent-${VERSION}"
          gh release create "$tag" dist/homeagent-agent-* --repo "$GITHUB_REPOSITORY" \
            --target "$MERGE_SHA" --title "Agent ${VERSION}" --generate-notes --draft
          verify_dir=$(mktemp -d)
          trap 'rm -rf "$verify_dir"' EXIT
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$verify_dir"
          test "$(find "$verify_dir" -maxdepth 1 -type f | wc -l)" -eq 18
          (cd "$verify_dir" && sha256sum -c ./*.sha256)
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
