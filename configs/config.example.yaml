server:
  listen: ":8080"
  public_url: "https://homeagent.rokilai.online"
storage:
  driver: "file" # 存储驱动：默认 "file"（零外部依赖，本地 JSON 存储）；可选 "mysql"
  data_dir: "/var/lib/homeagent"
  # 可选：当 driver 为 "mysql" 时的数据库连接配置
  # mysql:
  #   dsn: "homeagent:password@tcp(127.0.0.1:3306)/homeagent?charset=utf8mb4&parseTime=True&loc=Local"
  #   max_open_conns: 25
  #   max_idle_conns: 5
  #   conn_max_lifetime: "5m"
  # 可选：通过 Consul 服务发现动态解析 MySQL/ProxySQL 实例
  # consul:
  #   address: "127.0.0.1:8500"
  #   service_name: "mysql-proxy-service"
ssh:
  private_key: "/var/lib/homeagent/keys/admin_ed25519"
  connect_timeout: "5s"
auth:
  join_token: "CHANGE_ME"
sync:
  enabled: true
ipv6_ddns:
  enabled: true
  empty_address_grace_period: "10m"
  sync_timeout: "10s"
  ttl: 120
  provider: "cloudflare"
  credentials_file: "/var/lib/homeagent/ddns-credentials"
  networks:
    home:
      router_device_id: "openwrt-router-ab12cd34"
      prefix_state_ttl: "15m"
  devices:
    macbook-pro-ab12cd34:
      network_id: "home"
      record: "macbook.example.com"
      interface: "en0"

